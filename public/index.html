<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Stock Price</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#14182a;--muted:#5d6680;--line:#dde1ec;--accent:#3b5bdb;--on-accent:#fff;--up:#1a7f4b;--down:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#121a2e;--text:#f3f6fc;--muted:#a7b2c8;--line:#26324b;--accent:#8ba5ff;--on-accent:#071027;--up:#79e0b0;--down:#ff9caa}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(620px,100%)}
h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.03em;margin:0 0 .3rem}
.muted,.hint,.status{color:var(--muted)}.hint,.status{font-size:.88rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}
label{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:10px}
input,button{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid var(--line)}
input{flex:1;min-width:0;background:var(--bg);color:var(--text)}
button{cursor:pointer;background:var(--accent);color:var(--on-accent);border:0;font-weight:700}
button:disabled{opacity:.6;cursor:wait}
.status{margin-top:12px;white-space:pre-wrap}.error{color:var(--down)}
.result{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.price{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:800;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px;font-size:.9rem}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted)}.stats b{display:block;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:500;font-size:.82rem;padding:5px 10px;border-radius:999px}
.chart-card{margin-top:16px}
.ranges{display:flex;flex-wrap:wrap;gap:4px}
.ranges button{background:none;color:var(--muted);border:1px solid transparent;font-weight:600;font-size:.85rem;padding:5px 10px}
.ranges button[aria-pressed="true"]{background:var(--bg);color:var(--text);border-color:var(--line)}
.readout{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;margin:10px 0 4px;min-height:1.4em}
.chart{position:relative;height:220px}
.chart svg{display:block;width:100%;height:100%;touch-action:none}
.chart .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.axis{fill:var(--muted);font-size:11px}
@media(max-width:480px){.row{flex-direction:column}}
</style>
</head>
<body><main>
<nav style="display:flex;gap:16px;font-size:.92rem;margin-bottom:14px"><a href="/" style="color:var(--text);font-weight:700;text-decoration:none">Stock lookup</a><a href="/portfolio" style="color:var(--muted);text-decoration:none">Portfolio</a></nav>
<h1>Indian stock price</h1>
<p class="muted">Type a company name or NSE/BSE ticker to get its latest price.</p>

<section class="card">
  <form id="form">
    <label for="q">Stock name or ticker</label>
    <div class="row"><input id="q" placeholder="Reliance, TCS, HDFC Bank…" required autocomplete="off"><button id="go">Get price</button></div>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="result" class="result">
    <div id="name" class="muted"></div>
    <div id="price" class="price"></div>
    <div id="change"></div>
    <div class="stats">
      <div>Day high<b id="dayHigh"></b></div><div>Day low<b id="dayLow"></b></div>
      <div>Prev close<b id="prev"></b></div><div>Volume<b id="volume"></b></div>
      <div>52-week high<b id="yearHigh"></b></div><div>52-week low<b id="yearLow"></b></div>
    </div>
    <p id="time" class="hint"></p>
    <div class="chart-card">
      <div class="ranges" id="ranges" role="group" aria-label="Chart period">
        <button type="button" data-range="1D">1D</button><button type="button" data-range="1W">1W</button>
        <button type="button" data-range="1M">1M</button><button type="button" data-range="3M">3M</button>
        <button type="button" data-range="6M">6M</button><button type="button" data-range="1Y">1Y</button>
        <button type="button" data-range="3Y">3Y</button>
      </div>
      <div class="readout"><span id="hover"></span><span id="rangeChange"></span></div>
      <div class="chart" id="chart"><svg id="svg" aria-label="Price chart"></svg><div class="msg" id="chartMsg"></div></div>
    </div>
    <div id="others"></div>
  </div>
  <p class="hint">Data from Yahoo Finance. Prices may be delayed; check with your broker before trading.</p>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const inr = n => n == null || !isFinite(n) ? '—' :
  new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(n);
const num = n => n == null ? '—' : new Intl.NumberFormat('en-IN').format(n);

async function api(path) {
  let res;
  try { res = await fetch(path); }
  catch { throw new Error('The local server is not running. Double-click "Start Stock Price.command" and try again.'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `Server error (${res.status}).`);
  return data;
}

function setStatus(text, isError) { $('status').textContent = text; $('status').className = 'status' + (isError ? ' error' : ''); }

async function showQuote(match, matches) {
  setStatus(`Fetching ${match.symbol}…`);
  const q = await api('/api/quote?symbol=' + encodeURIComponent(match.symbol));
  $('name').textContent = `${q.name} · ${q.exchange} (${q.symbol})`;
  $('price').textContent = inr(q.price);
  if (q.change != null) {
    const up = q.change >= 0;
    $('change').textContent = `${up ? '▲ +' : '▼ '}${inr(q.change)} (${up ? '+' : ''}${q.changePercent.toFixed(2)}%) today`;
    $('change').style.color = up ? 'var(--up)' : 'var(--down)';
  } else $('change').textContent = '';
  $('dayHigh').textContent = inr(q.dayHigh); $('dayLow').textContent = inr(q.dayLow);
  $('prev').textContent = inr(q.previousClose); $('volume').textContent = num(q.volume);
  $('yearHigh').textContent = inr(q.yearHigh); $('yearLow').textContent = inr(q.yearLow);
  $('time').textContent = q.time ? 'As of ' + new Date(q.time * 1000).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }) + ' IST' : '';

  const box = $('others'); box.innerHTML = '';
  const rest = matches.filter(m => m.symbol !== match.symbol);
  if (rest.length) {
    box.innerHTML = '<p class="hint" style="margin-bottom:0">Not the one? Try:</p>';
    const chips = document.createElement('div'); chips.className = 'chips';
    rest.forEach(m => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
      b.textContent = `${m.name} · ${m.exchange}`;
      b.onclick = () => run(() => showQuote(m, matches));
      chips.appendChild(b);
    });
    box.appendChild(chips);
  }
  $('result').style.display = 'block';
  setStatus('');
  currentSymbol = q.symbol;
  loadChart(currentRange);
}

// ---------- Chart ----------
let currentSymbol = null, currentRange = '1D', chartData = null, chartRequest = 0;
const SVG_NS = 'http://www.w3.org/2000/svg';

document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => loadChart(b.dataset.range));

async function loadChart(range) {
  currentRange = range;
  document.querySelectorAll('#ranges button').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === range));
  const request = ++chartRequest; // ignore replies to older clicks
  $('chartMsg').textContent = 'Loading chart…'; $('svg').innerHTML = '';
  $('hover').textContent = ''; $('rangeChange').textContent = '';
  try {
    const data = await api(`/api/chart?symbol=${encodeURIComponent(currentSymbol)}&range=${range}`);
    if (request !== chartRequest) return;
    if (data.points.length < 2) throw new Error('Not enough data for this period.');
    chartData = data;
    $('chartMsg').textContent = '';
    drawChart();
  } catch (err) {
    if (request === chartRequest) { chartData = null; $('chartMsg').textContent = err.message; }
  }
}

function formatTime(t, range) {
  const d = new Date(t * 1000), opts = { timeZone: 'Asia/Kolkata' };
  if (range === '1D') return d.toLocaleTimeString('en-IN', { ...opts, hour: 'numeric', minute: '2-digit' });
  if (range === '1W') return d.toLocaleString('en-IN', { ...opts, weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  if (range === '3Y') return d.toLocaleDateString('en-IN', { ...opts, month: 'short', year: 'numeric' });
  return d.toLocaleDateString('en-IN', { ...opts, day: 'numeric', month: 'short', year: 'numeric' });
}

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  parent.appendChild(node);
  return node;
}

function drawChart() {
  const svg = $('svg'); svg.innerHTML = '';
  const { points, range } = chartData;
  const W = svg.clientWidth, H = svg.clientHeight;
  const pad = { top: 10, right: 8, bottom: 22, left: 8 };
  // 1D compares against yesterday's close; longer periods against the first point.
  const base = range === '1D' && chartData.previousClose ? chartData.previousClose : points[0][1];
  const prices = points.map(p => p[1]).concat(base);
  const min = Math.min(...prices), max = Math.max(...prices), span = max - min || 1;
  const x = i => pad.left + i / (points.length - 1) * (W - pad.left - pad.right);
  const y = v => pad.top + (max - v) / span * (H - pad.top - pad.bottom);
  const last = points[points.length - 1][1];
  const up = last >= base, color = up ? 'var(--up)' : 'var(--down)';

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const bottom = H - pad.bottom;
  el('path', { d: `${line}L${x(points.length - 1)},${bottom}L${x(0)},${bottom}Z`, fill: color, 'fill-opacity': .1 }, svg);
  el('line', { x1: pad.left, x2: W - pad.right, y1: y(base), y2: y(base), stroke: 'var(--muted)', 'stroke-dasharray': '3 4', 'stroke-opacity': .6 }, svg);
  el('path', { d: line, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
  el('text', { x: pad.left, y: H - 6, class: 'axis' }, svg).textContent = formatTime(points[0][0], range);
  el('text', { x: W - pad.right, y: H - 6, class: 'axis', 'text-anchor': 'end' }, svg).textContent = formatTime(points[points.length - 1][0], range);

  const diff = last - base;
  $('rangeChange').textContent = `${diff >= 0 ? '+' : ''}${inr(diff)} (${diff >= 0 ? '+' : ''}${(diff / base * 100).toFixed(2)}%) · ${range}`;
  $('rangeChange').style.color = color;

  // Hover / touch: show the price at the nearest point.
  const guide = el('line', { y1: pad.top, y2: bottom, stroke: 'var(--muted)', 'stroke-opacity': 0 }, svg);
  const dot = el('circle', { r: 4, fill: color, 'fill-opacity': 0 }, svg);
  const showDefault = () => {
    guide.setAttribute('stroke-opacity', 0); dot.setAttribute('fill-opacity', 0);
    $('hover').textContent = `${inr(last)} · ${formatTime(points[points.length - 1][0], range)}`;
  };
  svg.onpointermove = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.round((e.clientX - r.left - pad.left) / (W - pad.left - pad.right) * (points.length - 1));
    const p = points[Math.max(0, Math.min(points.length - 1, i))], px = x(points.indexOf(p));
    guide.setAttribute('x1', px); guide.setAttribute('x2', px); guide.setAttribute('stroke-opacity', .5);
    dot.setAttribute('cx', px); dot.setAttribute('cy', y(p[1])); dot.setAttribute('fill-opacity', 1);
    $('hover').textContent = `${inr(p[1])} · ${formatTime(p[0], range)}`;
  };
  svg.onpointerleave = showDefault;
  showDefault();
}

// Redraw at the new width when the window is resized.
window.addEventListener('resize', () => { if (chartData) drawChart(); });

async function run(task) {
  $('go').disabled = true;
  try { await task(); }
  catch (err) { $('result').style.display = 'none'; setStatus('Could not get the price: ' + err.message, true); }
  finally { $('go').disabled = false; }
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const query = $('q').value.trim();
  if (!query) return;
  run(async () => {
    $('result').style.display = 'none';
    setStatus('Searching…');
    const { matches } = await api('/api/search?q=' + encodeURIComponent(query));
    if (!matches.length) throw new Error(`No NSE/BSE stock found for “${query}”.`);
    await showQuote(matches[0], matches);
  });
});
</script>
</body></html>
